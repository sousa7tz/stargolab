# Configuração do deploy no Netlify.
# O cache imutável de /assets/* é gerado pelo build em dist/_headers.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Endereço antigo da demo de barbearia
[[redirects]]
  from = "/demo/barber/*"
  to = "/demo/barbershop/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
